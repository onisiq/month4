<!DOCTYPE html>
<html>
<head><title>Посты</title></head>
<body>
    <h1>Опубликованные посты с рейтингом выше 5</h1>
    {% if posts %}
        {% for post in posts %}
            <div>
                <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
                <p>Рейтинг: {{ post.rate }}</p>
                <p>{{ post.content|truncatewords:20 }}</p>
                <hr>
            </div>
        {% endfor %}
    {% else %}
        <p>Нет подходящих постов.</p>
    {% endif %}
</body>
</html>
