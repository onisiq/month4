{% extends 'blog/base.html' %}

{% block title %}Создать пост{% endblock %}

{% block content %}
    <h1>Создать пост</h1>
    <p>
        Не нашли нужную категорию?
        <a href="{% url 'category_create' %}?next=post_create">Создать категорию</a>
    </p>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
{% endblock %}
