{% extends 'blog/base.html' %}

{% block title %}Создать категорию{% endblock %}

{% block content %}
    <h1>Создать категорию</h1>
    <form method="post">
        {% csrf_token %}
        {% if next_url %}
            <input type="hidden" name="next" value="{{ next_url }}">
        {% endif %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
{% endblock %}
