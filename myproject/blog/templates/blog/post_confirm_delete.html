{% extends 'blog/base.html' %}

{% block title %}Удалить пост{% endblock %}

{% block content %}
    <h1>Удалить пост</h1>
    <p>Вы уверены, что хотите удалить "{{ post.title }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
        <a href="{% url 'post_detail' post.pk %}">Отмена</a>
    </form>
{% endblock %}
