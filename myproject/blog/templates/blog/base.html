<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Блог{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'post_list' %}">Посты</a>
        <a href="{% url 'post_create' %}">Создать пост</a>
        <a href="{% url 'category_create' %}">Создать категорию</a>
        {% if user.is_authenticated %}
            <span>Вы вошли как {{ user.username }}</span>
        {% else %}
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
